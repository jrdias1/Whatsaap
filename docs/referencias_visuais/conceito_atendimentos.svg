  <!-- Rótulos de autoria permanecem visíveis na timeline; autonomia é apenas exemplo futuro. -->
  <rect x="650" y="530" width="444" height="78" rx="11" fill="#e9f6f3" stroke="#b7e5dc"/><rect x="670" y="542" width="16" height="14" rx="4" fill="#0d9488"/><circle cx="678" cy="547" r="2" fill="#fff"/><path d="M674 553h8M675 556l-2 3m8-3 2 3" stroke="#0d9488" stroke-width="1.2"/><text x="693" y="553" fill="#087e72" font-family="Arial" font-size="10" font-weight="bold">IA autônoma · exemplo futuro</text><text x="670" y="579" class="text" font-size="11">Esta mensagem foi enviada pela IA sem aprovação humana.</text><text x="670" y="596" fill="#a65a12" font-family="Arial" font-size="9" font-weight="bold">DESATIVADA NO PILOTO</text>
  <rect x="650" y="620" width="444" height="78" rx="11" fill="#f1f4f5"/><circle cx="678" cy="641" r="8" fill="#d8e9e4"/><path d="m674 641 3 3 5-6" fill="none" stroke="#087e72" stroke-width="1.5"/><text x="693" y="645" fill="#446b70" font-family="Arial" font-size="10" font-weight="bold">Enviada por Ana · rascunho IA aprovado</text><text x="670" y="674" class="text" font-size="11">Perfeito, Mariana. Posso ajudar com seu retorno.</text><text x="1048" y="689" class="small" font-size="9">10:39</text>
