<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Conceito visual — atendimento e fluxo de pacientes</title>
  <desc id="desc">Tela conceitual de atendimento com fila de conversas, conversa selecionada e próximos passos do paciente.</desc>
  <defs><style>
    .bg{fill:#f4f7f8}.nav{fill:#132c3a}.white{fill:#fff}.border{stroke:#e5ecee;stroke-width:1}.text{fill:#183340;font:14px Arial,sans-serif}.muted{fill:#71848c;font:12px Arial,sans-serif}.heading{fill:#183340;font:bold 21px Arial,sans-serif}.small{fill:#71848c;font:11px Arial,sans-serif}.teal{fill:#0d9488}.light{fill:#e5f5f2}.bubble{fill:#eef6f5}.bubble2{fill:#f1f4f5}.tag{fill:#e5f5f2}.green{fill:#087e72}.orange{fill:#a65a12}
  </style></defs>
