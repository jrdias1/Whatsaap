  <text x="105" y="165" class="small" font-weight="bold">FILA DA UNIDADE</text><rect x="104" y="178" width="308" height="38" rx="8" fill="#e5f5f2"/><text x="120" y="202" class="green" font-family="Arial" font-size="13" font-weight="bold">Todas as conversas</text><text x="378" y="202" class="green" font-family="Arial" font-size="12">12</text>
  <circle cx="128" cy="266" r="21" fill="#f1d8c8"/><text x="121" y="271" fill="#7a4d37" font-family="Arial" font-size="12" font-weight="bold">MC</text><text x="163" y="258" class="text" font-weight="bold">Mariana Costa</text><text x="163" y="280" class="muted">Quero marcar meu retorno...</text><text x="370" y="256" class="small">10:42</text><circle cx="397" cy="283" r="9" fill="#0d9488"/><text x="394" y="287" fill="#fff" font-family="Arial" font-size="10">2</text><line x1="104" y1="300" x2="412" y2="300" class="border"/>
  <rect x="94" y="307" width="328" height="86" rx="9" fill="#f0f8f7"/><circle cx="128" cy="350" r="21" fill="#d8e6f0"/><text x="120" y="355" fill="#3c5d74" font-family="Arial" font-size="12" font-weight="bold">RM</text><text x="163" y="342" class="text" font-weight="bold">Rafael Mendes</text><text x="163" y="364" class="muted">Pode ser amanhã de manhã?</text><text x="370" y="340" class="small">10:35</text><circle cx="397" cy="367" r="9" fill="#0d9488"/><text x="394" y="371" fill="#fff" font-family="Arial" font-size="10">1</text>
  <circle cx="128" cy="438" r="21" fill="#eee2bf"/><text x="120" y="443" fill="#74612f" font-family="Arial" font-size="12" font-weight="bold">CO</text><text x="163" y="430" class="text" font-weight="bold">Camila Oliveira</text><text x="163" y="452" class="muted">Obrigada pelo atendimento!</text><text x="370" y="428" class="small">09:58</text><line x1="104" y1="480" x2="412" y2="480" class="border"/>
  <circle cx="128" cy="524" r="21" fill="#e5d9ed"/><text x="120" y="529" fill="#684b78" font-family="Arial" font-size="12" font-weight="bold">AS</text><text x="163" y="516" class="text" font-weight="bold">Ana Silva</text><text x="163" y="538" class="muted">Vi a mensagem sobre os termos</text><text x="370" y="514" class="small">09:41</text><line x1="104" y1="566" x2="412" y2="566" class="border"/>
  <text x="104" y="610" class="small" font-weight="bold">MINHAS TAREFAS</text><rect x="104" y="624" width="308" height="62" rx="9" fill="#fff9f1"/><circle cx="128" cy="655" r="13" fill="#ffebce"/><text x="124" y="659" class="orange" font-family="Arial" font-size="13">!</text><text x="151" y="650" class="text" font-size="12">Retornar feedback de paciente</text><text x="151" y="670" class="small">Hoje · NPS baixo</text>
  <rect x="438" width="688" height="960" fill="#f9fbfb"/><rect x="438" y="0" width="688" height="82" fill="#fff"/><line x1="438" y1="82" x2="1126" y2="82" class="border"/>
  <circle cx="478" cy="41" r="20" fill="#f1d8c8"/><text x="471" y="46" fill="#7a4d37" font-family="Arial" font-size="12" font-weight="bold">MC</text><text x="510" y="37" class="text" font-weight="bold">Mariana Costa</text><text x="510" y="57" class="small">Paciente · Unidade Centro</text><rect x="930" y="23" width="88" height="34" rx="8" fill="#f3f7f8"/><text x="948" y="45" class="muted">Assumir</text><text x="1051" y="47" class="text">···</text>
  <rect x="466" y="106" width="630" height="42" rx="8" fill="#eef6f5"/><text x="484" y="132" fill="#446b70" font-family="Arial" font-size="12">Conversa vinculada ao paciente e ao atendimento · Automação pausada durante revisão</text>
  <text x="758" y="183" class="small">HOJE · 10:35</text>
  <rect x="470" y="203" width="416" height="68" rx="12" class="bubble2"/><text x="490" y="230" class="text">Oi! Fiz minha sessão mês passado e queria</text><text x="490" y="251" class="text">marcar o retorno. Tem horário esta semana?</text><text x="840" y="261" class="small">10:35</text>
  <rect x="650" y="292" width="444" height="93" rx="12" class="bubble"/><text x="670" y="319" class="text">Olá, Mariana! Vou consultar a agenda para você.</text><text x="670" y="342" class="text">Prefere algum período ou profissional?</text><text x="670" y="368" class="small">Sugestão de resposta gerada pela IA · aguardando aprovação</text>
  <rect x="650" y="398" width="444" height="111" rx="11" fill="#fff" stroke="#b7e5dc"/><text x="670" y="425" class="green" font-family="Arial" font-size="12" font-weight="bold">PRÉVIA DA IA</text><text x="670" y="451" class="text">A agenda da Dra. Paula tem horários na quarta às</text><text x="670" y="473" class="text">14h e quinta às 10h. Algum funciona para você?</text><rect x="670" y="482" width="87" height="24" rx="6" fill="#0d9488"/><text x="686" y="499" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">Aprovar</text><rect x="765" y="482" width="72" height="24" rx="6" fill="#f1f4f5"/><text x="781" y="499" class="muted">Editar</text><text x="852" y="499" class="muted">Descartar</text>
  <rect x="466" y="821" width="630" height="84" rx="12" fill="#fff" stroke="#dce5e8"/><text x="486" y="851" class="muted">Escreva uma mensagem...</text><line x1="466" y1="873" x2="1096" y2="873" class="border"/><text x="487" y="895" class="small">＋  Anexar</text><rect x="1016" y="879" width="62" height="25" rx="7" fill="#0d9488"/><text x="1032" y="896" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">Enviar</text>
  <rect x="1126" width="314" height="960" fill="#fff"/><line x1="1126" y1="0" x2="1126" y2="960" class="border"/><text x="1152" y="50" class="heading" font-size="18">Resumo do paciente</text><circle cx="1184" cy="103" r="25" fill="#f1d8c8"/><text x="1176" y="108" fill="#7a4d37" font-family="Arial" font-size="12" font-weight="bold">MC</text><text x="1222" y="98" class="text" font-weight="bold">Mariana Costa</text><text x="1222" y="119" class="small">Paciente desde mar/2025</text>
  <line x1="1152" y1="151" x2="1414" y2="151" class="border"/><text x="1152" y="182" class="small">PRÓXIMO ATENDIMENTO</text><text x="1152" y="210" class="text" font-weight="bold">Nenhum agendado</text><rect x="1152" y="224" width="262" height="35" rx="8" fill="#e5f5f2"/><text x="1218" y="247" class="green" font-family="Arial" font-size="12" font-weight="bold">Criar agendamento</text>
  <text x="1152" y="302" class="small">ÚLTIMO ATENDIMENTO</text><text x="1152" y="328" class="text" font-weight="bold">Depilação a laser</text><text x="1152" y="349" class="muted">18 set 2026 · Concluído</text>
  <line x1="1152" y1="375" x2="1414" y2="375" class="border"/><text x="1152" y="406" class="small">ETIQUETAS</text><rect x="1152" y="419" width="94" height="26" rx="13" class="tag"/><text x="1167" y="437" class="green" font-family="Arial" font-size="11">Retorno</text><rect x="1254" y="419" width="108" height="26" rx="13" fill="#f0f3f5"/><text x="1267" y="437" class="muted">WhatsApp</text>
  <line x1="1152" y1="470" x2="1414" y2="470" class="border"/><text x="1152" y="501" class="small">HISTÓRICO RECENTE</text><circle cx="1161" cy="530" r="5" fill="#0d9488"/><text x="1178" y="534" class="text" font-size="12">Atendimento concluído</text><text x="1178" y="552" class="small">18 set · Depilação a laser</text><circle cx="1161" cy="583" r="5" fill="#96b0b6"/><text x="1178" y="587" class="text" font-size="12">Termo enviado</text><text x="1178" y="605" class="small">17 set · WhatsApp</text><circle cx="1161" cy="636" r="5" fill="#96b0b6"/><text x="1178" y="640" class="text" font-size="12">Cadastro atualizado</text><text x="1178" y="658" class="small">12 set · por Ana Silva</text>
  <rect x="1152" y="710" width="262" height="83" rx="10" fill="#f4f8fa"/><text x="1170" y="738" class="small" font-weight="bold">ACESSO A DADOS SENSÍVEIS</text><text x="1170" y="761" class="muted">Visualizações e alterações são</text><text x="1170" y="779" class="muted">registradas na trilha de auditoria.</text>
